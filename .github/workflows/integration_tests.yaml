# End-to-end integration test: bitcoind-patched + walletless
# bip300301_enforcer + simplepool (pps-classic) + a JS CPU miner, driven by
# tests/test_e2e_regtest.sh.
#
# Binary versions are pinned in scripts/regtest/setup.sh (the
# pinned-versions block) so a red run maps to our code or to a
# deliberate version bump — not to upstream silently shipping a new
# "latest". The one exception is the enforcer, which publishes no
# versioned artifacts; setup.sh prints a WARNING when the latest zip
# drifts from the version we last validated against, so an
# enforcer-caused breakage is at least attributable from the logs.
name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Match check_build.yaml: CI runs only in the LayerTwo-Labs org repo.
    if: github.repository_owner == 'LayerTwo-Labs'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        # No `apt-get update` — see .github/scripts/apt-install.sh for why.
        run: >
          .github/scripts/apt-install.sh
          build-essential
          libsqlite3-dev
          libcurl4-openssl-dev
          libhiredis-dev
          unzip
          jq
          sqlite3
          netcat-openbsd

      - name: Build
        run: make -j"$(nproc)"

      - name: Run end-to-end regtest test
        run: bash tests/test_e2e_regtest.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ github.run_id }}
          path: |
            .regtest-e2e/logs/
            /tmp/simplepool-e2e.log
            /tmp/simplepool-e2e.conf
            /tmp/simplepool-int.log
          retention-days: 14
          if-no-files-found: ignore

  # Node-side unit tests (dashboard audit surface + payout worker). Compiling the EJS templates is not enough — a
  # template can compile and still throw at render time, and a lib function
  # can be valid while calling a helper that is not in scope. Both shipped
  # once, so these drive the real query + render path against a real DB.
  # Cheap (no chain, no build) so it runs on every push.
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci || npm install

      - name: Run dashboard tests
        working-directory: dashboard
        run: npm test

      - name: Install payout dependencies
        working-directory: payout
        run: npm ci || npm install

      - name: Run payout worker tests
        working-directory: payout
        run: npm test

  # The payout path the coinbase e2e skips: wallet-enabled enforcer +
  # thunder, a real deposit, and one payout tick broadcasting a Thunder
  # transaction (tests/test_payout_regtest.sh). Separate job purely for
  # wall-clock parallelism — the stacks allocate ports dynamically.
  payout-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository_owner == 'LayerTwo-Labs'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        timeout-minutes: 5
        # Every one of these is already on the GitHub runner image; the call
        # is kept so the job states its own dependencies rather than relying
        # on the image silently continuing to carry them.
        run: >
          .github/scripts/apt-install.sh
          unzip
          jq
          sqlite3
          netcat-openbsd

      - name: Run payout regtest test
        run: bash tests/test_payout_regtest.sh

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: payout-logs-${{ github.run_id }}
          path: .regtest-payout/logs/
          retention-days: 14
          if-no-files-found: ignore
